version: '3.8'

networks:
  starrocks-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  minio1-data:
  minio2-data:
  minio3-data:
  fe1-meta:
  fe2-meta:
  fe3-meta:
  cn1-data:
  cn2-data:
  cn3-data:

services:
  # MinIO Cluster (3 nodes)
  minio1:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio1
    hostname: minio1
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.10
    volumes:
      - minio1-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_VOLUMES: "http://minio{1...3}:9000/data"
    command: server --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9001:9001"
      - "9000:9000"
    restart: unless-stopped

  minio2:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio2
    hostname: minio2
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.11
    volumes:
      - minio2-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_VOLUMES: "http://minio{1...3}:9000/data"
    command: server --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9002:9001"
    restart: unless-stopped

  minio3:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio3
    hostname: minio3
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.12
    volumes:
      - minio3-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_VOLUMES: "http://minio{1...3}:9000/data"
    command: server --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    ports:
      - "9003:9001"
    restart: unless-stopped

  # StarRocks FE Nodes (3 nodes for HA)
  fe1:
    image: docker.arvancloud.ir/starrocks/fe-ubuntu:4.0-latest
    container_name: starrocks-fe1
    hostname: fe1
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.20
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - fe1-meta:/opt/starrocks/fe/meta
      - ./config/fe1.conf:/opt/starrocks/fe/conf/fe.conf:ro
    ports:
      - "8031:8030"
      - "9021:9020"
      - "9031:9030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      - minio1
      - minio2
      - minio3

  fe2:
    image: docker.arvancloud.ir/starrocks/fe-ubuntu:4.0-latest
    container_name: starrocks-fe2
    hostname: fe2
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.21
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - fe2-meta:/opt/starrocks/fe/meta
      - ./config/fe2.conf:/opt/starrocks/fe/conf/fe.conf:ro
    ports:
      - "8032:8030"
      - "9022:9020"
      - "9032:9030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      - fe1

  fe3:
    image: docker.arvancloud.ir/starrocks/fe-ubuntu:4.0-latest
    container_name: starrocks-fe3
    hostname: fe3
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.22
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - fe3-meta:/opt/starrocks/fe/meta
      - ./config/fe3.conf:/opt/starrocks/fe/conf/fe.conf:ro
    ports:
      - "8033:8030"
      - "9023:9020"
      - "9033:9030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/api/bootstrap"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      - fe1

  # StarRocks Compute Nodes (3 nodes)
  cn1:
    image: docker.arvancloud.ir/starrocks/cn-ubuntu:4.0-latest
    container_name: starrocks-cn1
    hostname: cn1
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.30
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - cn1-data:/opt/starrocks/cn/storage
      - ./config/cn1.conf:/opt/starrocks/cn/conf/cn.conf:ro
    ports:
      - "8041:8040"
      - "9051:9050"
    restart: unless-stopped
    depends_on:
      - fe1
      - fe2
      - fe3

  cn2:
    image: docker.arvancloud.ir/starrocks/cn-ubuntu:4.0-latest
    container_name: starrocks-cn2
    hostname: cn2
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.31
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - cn2-data:/opt/starrocks/cn/storage
      - ./config/cn2.conf:/opt/starrocks/cn/conf/cn.conf:ro
    ports:
      - "8042:8040"
      - "9052:9050"
    restart: unless-stopped
    depends_on:
      - fe1
      - fe2
      - fe3

  cn3:
    image: docker.arvancloud.ir/starrocks/cn-ubuntu:4.0-latest
    container_name: starrocks-cn3
    hostname: cn3
    networks:
      starrocks-net:
        ipv4_address: 172.20.0.32
    environment:
      - TZ=UTC
      - HOST_TYPE=FQDN
    volumes:
      - cn3-data:/opt/starrocks/cn/storage
      - ./config/cn3.conf:/opt/starrocks/cn/conf/cn.conf:ro
    ports:
      - "8043:8040"
      - "9053:9050"
    restart: unless-stopped
    depends_on:
      - fe1
      - fe2
      - fe3