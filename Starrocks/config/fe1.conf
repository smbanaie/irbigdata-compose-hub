# fe1.conf - Leader FE Configuration
LOG_DIR = /opt/starrocks/fe/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:file=/opt/starrocks/fe/log/fe.gc.log.$DATE:time"

# FE ports
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# Meta directory
meta_dir = /opt/starrocks/fe/meta

# FE priority for leader election (higher value = higher priority)
priority_networks = 172.20.0.0/16

# System limits
max_connection_scheduler_threads_num = 4096
qe_max_connection = 4096

# Enable metadata synchronization
enable_collect_query_detail_info = true

# Storage configuration for shared-data mode
run_mode = shared_data

# MinIO S3 configuration
aws_s3_path = starrocks
aws_s3_region = us-east-1
aws_s3_endpoint = http://minio1:9000
aws_s3_access_key = minioadmin
aws_s3_secret_key = minioadmin123
aws_s3_use_instance_profile = false
aws_s3_use_aws_sdk_default_behavior = false

# Cloud native storage
cloud_native_meta_port = 6090
cloud_native_storage_type = S3

# Cluster configuration
heartbeat_timeout_second = 30
tablet_create_timeout_second = 10

# Enable JVM monitoring
enable_jvm_monitor = true

# Query timeout
query_timeout = 300