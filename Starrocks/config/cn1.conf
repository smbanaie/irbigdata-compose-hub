# =====================================================
# cn1.conf - Compute Node 1 Configuration
# =====================================================
LOG_DIR = /opt/starrocks/cn/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xmx16384m -XX:+UseG1GC -Xlog:gc*:file=/opt/starrocks/cn/log/cn.gc.log.$DATE:time"

# Ports configuration
thrift_port = 9060
be_port = 9050
webserver_port = 8040
heartbeat_service_port = 9050
brpc_port = 8060

# Storage configuration
storage_root_path = /opt/starrocks/cn/storage

# Network configuration
priority_networks = 172.20.0.0/16

# Memory limits (90% of container memory)
mem_limit = 90%
chunk_reserved_bytes_limit = 10737418240

# Data cache configuration (10GB memory cache, 20GB disk cache)
datacache_enable = true
datacache_mem_size = 10737418240
datacache_disk_size = 21474836480
datacache_disk_path = /opt/starrocks/cn/storage/datacache

# Performance tuning
vector_chunk_size = 4096
disable_storage_page_cache = false

# S3/MinIO Object Storage Configuration
object_storage_access_key_id = minioadmin
object_storage_secret_access_key = minioadmin123
object_storage_endpoint = http://minio1:9000
object_storage_region = us-east-1

# Spill to disk configuration
spill_local_storage_dir = /opt/starrocks/cn/storage/spill

# StarRocks Lake/Shared-data mode
starlet_port = 9070
lake_compaction_max_tasks = 4

# Query execution
query_timeout = 300

# Monitoring
enable_metric_calculator = true