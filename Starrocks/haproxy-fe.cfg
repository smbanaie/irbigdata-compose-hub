global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    # Default SSL material locations
    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

    # Default ciphers to use on SSL-enabled listening sockets.
    # For more information, see ciphers(1SSL). This list is from:
    #  https://hynek.me/articles/hardening-your-web-servers-ssl-ciphers/
    # An alternative list with additional directives can be obtained from
    #  https://mozilla.github.io/server-side-tls/ssl-config-generator/?server=haproxy
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# -----------------------------------------------------------------------------
# StarRocks Frontend Load Balancer
# -----------------------------------------------------------------------------
frontend starrocks-fe-sql
    bind *:9030
    default_backend starrocks-fe-sql-backend

frontend starrocks-fe-http
    bind *:8030
    default_backend starrocks-fe-http-backend

# -----------------------------------------------------------------------------
# StarRocks FE SQL Backend (MySQL Protocol)
# -----------------------------------------------------------------------------
backend starrocks-fe-sql-backend
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect port 9030
    tcp-check send PING\r\n
    tcp-check expect string PONG

    server starrocks-fe-1 starrocks-fe-1:9030 check inter 5s rise 2 fall 3
    server starrocks-fe-2 starrocks-fe-2:9030 check inter 5s rise 2 fall 3
    server starrocks-fe-3 starrocks-fe-3:9030 check inter 5s rise 2 fall 3

# -----------------------------------------------------------------------------
# StarRocks FE HTTP Backend
# -----------------------------------------------------------------------------
backend starrocks-fe-http-backend
    mode http
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200

    server starrocks-fe-1 starrocks-fe-1:8030 check inter 5s rise 2 fall 3
    server starrocks-fe-2 starrocks-fe-2:8030 check inter 5s rise 2 fall 3
    server starrocks-fe-3 starrocks-fe-3:8030 check inter 5s rise 2 fall 3

# -----------------------------------------------------------------------------
# HAProxy Statistics
# -----------------------------------------------------------------------------
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE