services:
  spark-master:
    image: docker.arvancloud.ir/nikamooz/spark:3.1.2
    build: ./build/spark
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data/apps:/opt/spark-apps
      - ./data/data:/opt/spark-data
    environment:
      - SPARK_LOCAL_IP=spark-master
      - SPARK_WORKLOAD=master
      - SPARK_LOCAL_HOSTNAME=spark-master
      - CORE_CONF_fs_defaultFS=hdfs://hadoop:8020
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - services
    restart: unless-stopped

  spark-worker1:
    image: docker.arvancloud.ir/nikamooz/spark:3.1.2
    build: ./build/spark
    container_name: spark-worker1
    hostname: spark-worker1
    ports:
      - "8081:8080"
      - "7000:7000"
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker1
      - SPARK_LOCAL_HOSTNAME=spark-worker1
      - CORE_CONF_fs_defaultFS=hdfs://hadoop:8020
    mem_limit: ${MEM_LIMIT:-4g}
    volumes:
      - ./data/apps:/opt/spark-apps
      - ./data/data:/opt/spark-data
    networks:
      - services
    restart: unless-stopped

  spark-worker2:
    image: docker.arvancloud.ir/nikamooz/spark:3.1.2
    build: ./build/spark
    container_name: spark-worker2
    hostname: spark-worker2
    ports:
      - "8082:8080"
      - "7001:7000"
    depends_on:
      spark-master:
        condition: service_started
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
      - SPARK_DRIVER_MEMORY=1G
      - SPARK_EXECUTOR_MEMORY=1G
      - SPARK_WORKLOAD=worker
      - SPARK_LOCAL_IP=spark-worker2
      - SPARK_LOCAL_HOSTNAME=spark-worker2
      - CORE_CONF_fs_defaultFS=hdfs://hadoop:8020
    mem_limit: ${MEM_LIMIT:-4g}
    volumes:
      - ./data/apps:/opt/spark-apps
      - ./data/data:/opt/spark-data
    networks:
      - services
    restart: unless-stopped

  pyspark:
    image: docker.arvancloud.ir/nikamooz/pyspark:3.1.2
    build: ./build/pyspark
    container_name: pyspark
    hostname: pyspark
    volumes:
      - ./data/notebooks:/opt/spark-notebooks
      - ./data/data:/opt/spark-data
    ports:
      - 8888:8888
      - 4040-4042:4040-4042
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_LOCAL_IP=pyspark
      - SPARK_WORKLOAD=submit
      - SPARK_LOCAL_HOSTNAME=pyspark
    depends_on:
      spark-master:
        condition: service_started
    mem_limit: ${MEM_LIMIT:-2g}
    networks:
      - services
    restart: unless-stopped

networks:
  services:
    name: ${APP_NAME}_network

volumes:
  dfs_data:
