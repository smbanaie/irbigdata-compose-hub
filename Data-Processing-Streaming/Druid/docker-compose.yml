volumes:
  metadata_data:
  middle_var:
  historical_var:
  broker_var:
  coordinator_var:
  router_var:
  druid_shared:

services:
  postgres_druid:
    container_name: postgres_druid
    hostname: postgres_druid
    image: docker.arvancloud.ir/library/postgres:${PG_VERSION:-16-alpine}
    volumes:
      - metadata_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=druid
      - POSTGRES_USER=druid
      - POSTGRES_DB=druid
      - PGDATA=/var/lib/postgresql/data
    ports:
      - 5433:5432
    mem_limit: ${MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U druid"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - services

  zookeeper:
    container_name: zookeeper_druid
    hostname: zookeeper_druid
    image: docker.arvancloud.ir/library/zookeeper:3.5
    environment:
      - ZOO_MY_ID=1
    mem_limit: ${MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - services

  coordinator:
    image: docker.arvancloud.ir/apache/druid:${DRUID_VERSION:-30.0.0}
    container_name: coordinator
    volumes:
      - druid_shared:/opt/shared
      - coordinator_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres_druid:
        condition: service_healthy
    ports:
      - "9081:8081"
    command:
      - coordinator
    env_file:
      - environment
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - services

  broker:
    image: docker.arvancloud.ir/apache/druid:${DRUID_VERSION:-30.0.0}
    container_name: broker
    hostname: broker
    volumes:
      - broker_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres_druid:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "9082:8082"
    command:
      - broker
    env_file:
      - environment
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - services

  historical:
    image: docker.arvancloud.ir/apache/druid:${DRUID_VERSION:-30.0.0}
    container_name: historical
    volumes:
      - druid_shared:/opt/shared
      - historical_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres_druid:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "9083:8083"
    command:
      - historical
    env_file:
      - environment
    mem_limit: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - services

  middlemanager:
    image: docker.arvancloud.ir/apache/druid:${DRUID_VERSION:-30.0.0}
    container_name: middlemanager
    volumes:
      - druid_shared:/opt/shared
      - middle_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres_druid:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8091:8091"
    command:
      - middleManager
    env_file:
      - environment
    mem_limit: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - services

  router:
    image: docker.arvancloud.ir/apache/druid:${DRUID_VERSION:-30.0.0}
    container_name: router
    volumes:
      - router_var:/opt/druid/var
    depends_on:
      zookeeper:
        condition: service_healthy
      postgres_druid:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    ports:
      - "8888:8888"
    command:
      - router
    env_file:
      - environment
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/status/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - services

networks:
  services:
    name: ${APP_NAME}_network
