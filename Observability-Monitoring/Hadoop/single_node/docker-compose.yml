services:
  hadoop:
    container_name: ${CONTAINER_NAME:-hadoop}
    hostname: ${CONTAINER_NAME:-hadoop}
    image: docker.arvancloud.ir/nikammoz/hadoop:3.3.1
    build: ./hadoop
    ports:
      - 9870:9870
      - 8088:8088
      - 9000:9000
    volumes:
      - dfs_data2:/home/hduser/dfs/data
    mem_limit: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - services
    restart: unless-stopped

volumes:
  dfs_data2:

networks:
  services:
    name: ${APP_NAME}_network
