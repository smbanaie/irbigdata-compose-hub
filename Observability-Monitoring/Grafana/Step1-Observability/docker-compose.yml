networks:
  grafana:

volumes:
  app_data:

services:
  prometheus:
    image: docker.arvancloud.ir/prom/prometheus:latest
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - 9090:9090
    mem_limit: ${MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - grafana

  loki:
    image: docker.arvancloud.ir/grafana/loki:latest
    ports:
      - 3100:3100
    command: -config.file=/etc/loki/local-config.yaml
    mem_limit: ${MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - grafana

  promtail:
    image: docker.arvancloud.ir/grafana/promtail:latest
    volumes:
      - app_data:/var/log
    mem_limit: ${MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - grafana

  grafana:
    image: docker.arvancloud.ir/grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - "GF_DEFAULT_APP_MODE=development"
      - "GF_LOG_LEVEL=debug"
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_FEATURE_TOGGLES_ENABLE=alertingSimplifiedRouting
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    mem_limit: ${MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "wget", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - grafana

  app:
    build: ./app
    ports:
      - 8081:80
    volumes:
      - app_data:/var/log
    restart: unless-stopped
    networks:
      - grafana

  db:
    image: docker.arvancloud.ir/grafana/tns-db:latest
    ports:
      - 8082:80
    restart: unless-stopped
    networks:
      - grafana
