services:
  minio:
    image: docker.arvancloud.ir/bitnami/minio:2025.4.22
    environment:
      - MINIO_ROOT_USER=minio-root-user
      - MINIO_ROOT_PASSWORD=minio-root-password
      - MINIO_API_PORT_NUMBER=9000
      - MINIO_CONSOLE_PORT_NUMBER=9001
      - MINIO_SCHEME=http
      - MINIO_DEFAULT_BUCKETS=irisa-warehouse
    healthcheck:
      test: [ "CMD", "mc", "ls", "local", "|", "grep", "irisa-warehouse" ]
      interval: 2s
      timeout: 10s
      retries: 2
      start_period: 15s
    profiles:
      - minio
    networks:
      - services
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data

  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.Spark4-Official.final
    image: sepahram/spark4:apache
    container_name: spark-master
    ports:
      - "9080:8080"
      - "7077:7077"
    command: >
      bash -c "bin/spark-class org.apache.spark.deploy.master.Master
               --host spark-master --port 7077 --webui-port 8080"
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./data/data:/spark-data
      - ./data/apps:/spark-app
      - ./data/jars:/spark-jars
    networks:
      - services

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.Spark4-Official.final
    image: sepahram/spark4:apache
    container_name: spark-worker
    depends_on:
      - spark-master
    ports:
      - "9081:8081"
    command: >
      bin/spark-class org.apache.spark.deploy.worker.Worker
      --webui-port 8081
      --cores 2
      --memory 2G
      spark://spark-master:7077
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./data/data:/spark-data
      - ./data/apps:/spark-app
      - ./data/jars:/spark-jars
    networks:
      - services

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.Spark4-Official.final
    image: sepahram/spark4:apache
    container_name: jupyter
    depends_on:
      - spark-master
    ports:
      - "9888:8888"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    command: bash -c "cd /opt/spark/notebooks && jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --ServerApp.token='' --ServerApp.password=''"
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=jupyter
      - PYSPARK_DRIVER_PYTHON_OPTS="notebook"
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./data/data:/spark-data
      - ./data/apps:/spark-app
      - ./data/jars:/spark-jars
    networks:
      - services

volumes:
  minio-data:

networks:
  services:
    name: ${APP_NAME:-sepahram}_network
