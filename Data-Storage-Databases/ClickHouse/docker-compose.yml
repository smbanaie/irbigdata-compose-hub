services:
  clickhouse:
    image: docker.arvancloud.ir/clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.5}
    container_name: clickhouse-26.5-jammy
    hostname: clickhouse-26.5-jammy
    ports:
      - "${CH_HTTP_PORT:-8123}:8123"
      - "${CH_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickh0use@123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-forex}
      CLICKHOUSE_DISABLE_TELEMETRY: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config.d:/etc/clickhouse-server/config.d
      - ./users.d:/etc/clickhouse-server/users.d
      - ./initdb:/docker-entrypoint-initdb.d
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '${CH_CPU_LIMIT:-4}'
          memory: ${CH_MEM_LIMIT:-16G}
        reservations:
          cpus: '${CH_CPU_RESERVE:-2}'
          memory: ${CH_MEM_RESERVE:-8G}
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - clickhouse_net
    restart: unless-stopped

volumes:
  clickhouse_data:
  clickhouse_logs:

networks:
  clickhouse_net:
    name: ${APP_NAME:-sepahram}_network
