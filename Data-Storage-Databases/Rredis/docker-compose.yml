services:
  redis:
    image: docker.arvancloud.ir/library/redis:${REDIS_VERSION:-alpine}
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-odiF2t11}
    ports:
      - "6379:6379"
    environment:
      - REDIS_REPLICATION_MODE=master
    volumes:
      - redis_data:/var/lib/redis
    mem_limit: ${MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - services
    restart: unless-stopped

volumes:
  redis_data:

networks:
  services:
    name: ${APP_NAME}_network
