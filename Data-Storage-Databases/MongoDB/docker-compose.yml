services:
  mongo:
    image: docker.arvancloud.ir/library/mongo:${MONGO_VERSION:-7}
    container_name: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-1234}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-logs}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mongo-express:
    image: docker.arvancloud.ir/library/mongo-express:${MONGO_EXPRESS_VERSION:-latest}
    container_name: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-1234}
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      mongo:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT:-256m}
    restart: unless-stopped

volumes:
  mongo_data:
