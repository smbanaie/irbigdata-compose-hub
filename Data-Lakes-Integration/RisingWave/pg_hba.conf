# PostgreSQL Host-Based Authentication
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Allow local connections
local   all             postgres                                trust
local   all             all                                     trust

# Allow connections from Docker network (trust for development)
host    all             all             0.0.0.0/0               trust

# Allow replication connections from Docker network
host    replication     postgres        0.0.0.0/0               trust

# Allow connections from specific networks (if needed)
host    all             all             172.16.0.0/12           trust
host    all             all             192.168.0.0/16          trust
host    replication     postgres        172.16.0.0/12           trust
host    replication     postgres        192.168.0.0/16          trust