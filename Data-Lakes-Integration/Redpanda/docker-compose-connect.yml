services:
  redpanda:
    container_name: redpanda
    hostname: redpanda
    image: docker.arvancloud.ir/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp "1"
      - --memory "1G"
      - --reserve-memory "0M"
      - --overprovisioned
      - --node-id "0"
      - --check=false
      - --rpc-addr "0.0.0.0:33145"
      - --advertise-rpc-addr "redpanda:33145"
      - --kafka-addr "0.0.0.0:3092"
      - --advertise-kafka-addr "redpanda:3092"
      - --pandaproxy-addr "0.0.0.0:8082"
      - --advertise-pandaproxy-addr "redpanda:8082"
    ports:
      - "9644:9644"
      - "8082:8082"
    environment:
      KAFKA_ADVERTISED_LISTENERS: "GENERAL://redpanda:3092"
      KAFKA_LISTENERS: "GENERAL://0.0.0.0:3092"
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: [ "CMD", "curl", "-f", "localhost:9644/v1/status/ready" ]
      start_period: 5s
      interval: 3s
    restart: unless-stopped
    networks:
      - redpanda_network

  redpanda_console:
    image: docker.arvancloud.ir/redpandadata/console:latest
    container_name: redpanda_console
    ports:
      - "9100:8080"
    environment:
      KAFKA_BROKERS: "redpanda:3092"
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT:-256m}
    restart: unless-stopped
    networks:
      - redpanda_network

  redpanda_connect:
    image: docker.arvancloud.ir/redpandadata/connect:latest
    container_name: redpanda_connect
    command: run --chilled
    volumes:
      - ./connect-config.yaml:/connect.yaml
      - ./data:/data
    depends_on:
      redpanda:
        condition: service_healthy
    mem_limit: ${MEM_LIMIT:-512m}
    restart: unless-stopped
    networks:
      - redpanda_network

networks:
  redpanda_network:
    name: redpanda_network
