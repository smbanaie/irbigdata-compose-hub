services:
  nessie:
    image: docker.arvancloud.ir/projectnessie/nessie:latest
    container_name: nessie
    ports:
      - 19120:19120
    mem_limit: ${MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19120/api/v1/trees"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dremio-file-ingestion

  minio:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=storage
      - MINIO_REGION_NAME=us-east-1
      - MINIO_REGION=us-east-1
    ports:
      - 9001:9001
      - 9000:9000
    command: ["server", "/data", "--console-address", ":9001"]
    mem_limit: ${MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - dremio-file-ingestion

  minio-setup:
    image: docker.arvancloud.ir/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
    volumes:
      - ./sampledata:/tmp/data
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...' &&
      /bin/sleep 10 &&
      mc alias set minio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb minio/warehouse &&
      mc mb minio/datalakehouse &&
      mc mb minio/sampledata &&
      mc cp --recursive /tmp/data/* minio/sampledata/ &&
      echo 'Buckets created and data loaded.'"
    networks:
      - dremio-file-ingestion

  dremio:
    image: docker.arvancloud.ir/dremio/dremio-oss
    container_name: dremio
    ports:
      - 9047:9047
      - 31010:31010
      - 32010:32010
      - 45678:45678
    environment:
      - DREMIO_JAVA_SERVER_EXTRA_OPTS=-Dpaths.dist=file:///opt/dremio/data/dist
    depends_on:
      minio-setup:
        condition: service_completed_successfully
    mem_limit: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9047"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - dremio-file-ingestion

  superset:
    image: docker.arvancloud.ir/alexmerced/dremio-superset
    container_name: superset
    ports:
      - 8088:8088
    mem_limit: ${MEM_LIMIT:-1g}
    restart: unless-stopped
    networks:
      - dremio-file-ingestion

networks:
  dremio-file-ingestion:
