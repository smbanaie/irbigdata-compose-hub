events {
    worker_connections 4096;
}

http {
    # CRITICAL: Use hash for consistent routing of multipart uploads
    upstream minio_backend {
        hash $request_uri consistent;
        server minio-1:9301 max_fails=2 fail_timeout=30s;
        server minio-2:9301 max_fails=2 fail_timeout=30s;
        server minio-3:9301 max_fails=2 fail_timeout=30s;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 3600s;
    }

    server {
        listen 9301;
        server_name _;

        # Critical settings for large uploads
        client_max_body_size 0;
        client_body_buffer_size 512k;
        client_body_timeout 3600s;
        client_header_timeout 300s;
        
        # CRITICAL: Keep request buffering ON
        proxy_buffering off;
        proxy_request_buffering on;
        
        # Extended timeouts for long-running multipart uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        
        # Keep connections alive
        keepalive_timeout 3600s;
        keepalive_requests 10000;

        # Required for MinIO
        ignore_invalid_headers off;
        
        location / {
            proxy_pass http://minio_backend;
            
            # Headers
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-NginX-Proxy true;
            
            # CRITICAL: HTTP/1.1 with keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Don't change encoding
            proxy_pass_request_headers on;
            
            # Critical for large uploads - prevent premature connection close
            proxy_socket_keepalive on;
            
            # Handle connection issues gracefully
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 10s;
        }
    }
}