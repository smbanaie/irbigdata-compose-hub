---
x-image: &image
  image: ${RW_IMAGE:-docker.arvancloud.ir/risingwavelabs/risingwave:v2.8.0-alpha.20260103}

x-risingwave-environment: &risingwave-environment
  RUST_BACKTRACE: "1"
  ENABLE_TELEMETRY: ${ENABLE_TELEMETRY:-true}
  RW_TELEMETRY_TYPE: ${RW_TELEMETRY_TYPE:-"docker-compose"}

networks:
  rw-network:
    driver: bridge

services:
  # =============================================================================
  # PostgreSQL with Replication (Primary-Replica)
  # =============================================================================
  postgres-primary:
    image: "docker.arvancloud.ir/postgres:18"
    container_name: postgres-primary
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: metadata
      POSTGRES_INITDB_ARGS: --encoding=UTF-8 --lc-collate=C --lc-ctype=C
    expose:
      - "5432"
    ports:
      - "5432:5432"
    volumes:
      - postgres-primary-data:/var/lib/postgresql/18/data
      - ./pg_hba.conf:/var/lib/postgresql/18/data/pg_hba.conf:ro
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hba_file=/var/lib/postgresql/18/data/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  postgres-replica-setup:
    image: "docker.arvancloud.ir/postgres:18"
    container_name: postgres-replica-setup
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/data/pgdata
    volumes:
      - postgres-replica-data:/var/lib/postgresql/18/data
    command:
      - bash
      - -c
      - |
        echo "Checking if replica data already exists..."
        if [ -f /var/lib/postgresql/18/data/pgdata/PG_VERSION ]; then
          echo "Replica data already exists, skipping setup"
          exit 0
        fi

        echo "Setting up replica database..."
        echo "Creating fresh data directory..."
        mkdir -p /var/lib/postgresql/18/data/pgdata
        echo "Setting correct permissions..."
        chown -R postgres:postgres /var/lib/postgresql/18/data/pgdata
        chmod 0700 /var/lib/postgresql/18/data/pgdata
        echo "Running pg_basebackup as postgres user..."
        until gosu postgres pg_basebackup -v -h postgres-primary -U postgres -D /var/lib/postgresql/18/data/pgdata -Fp -Xs -R; do
          echo 'Waiting for primary to be ready...'
          sleep 2
        done
        echo "Replication setup complete"
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - rw-network

  postgres-replica:
    image: "docker.arvancloud.ir/postgres:18"
    container_name: postgres-replica
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/18/data/pgdata
    expose:
      - "5432"
    ports:
      - "5433:5432"
    volumes:
      - postgres-replica-data:/var/lib/postgresql/18/data
    command:
      - gosu
      - postgres
      - postgres
      - -c
      - hot_standby=on
    depends_on:
      postgres-replica-setup:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  # =============================================================================
  # MinIO Cluster (3 nodes) - Distributed Mode WITHOUT Load Balancer
  # RisingWave will connect directly to minio-1:9000
  # MinIO handles internal routing and load balancing
  # =============================================================================
  minio-1:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-1
    hostname: minio-1
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data-1:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  minio-2:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-2
    hostname: minio-2
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data-2:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  minio-3:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-3
    hostname: minio-3
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio-data-3:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  # =============================================================================
  # MinIO Initialization - Create bucket
  # =============================================================================
  minio-init:
    image: docker.arvancloud.ir/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
      minio-lb:
        condition: service_healthy
    networks:
      - rw-network
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO cluster to be ready..."
        sleep 10
        
        echo "Setting up MinIO alias..."
        until mc alias set minio http://minio-1:9000 hummockadmin hummockadmin; do
          echo "Waiting for MinIO connection..."
          sleep 2
        done
        
        echo "Creating bucket hummock001..."
        mc mb minio/hummock001 --ignore-existing
        
        echo "MinIO initialization complete."
    restart: "no"

  # =============================================================================
  # MinIO Load Balancer (HAProxy)
  # =============================================================================
  minio-lb:
    image: docker.arvancloud.ir/library/haproxy:latest
    container_name: minio-lb
    hostname: minio-lb
    depends_on:
      - minio-1
      - minio-2
      - minio-3
    ports:
      - "9100:9000"   # external access (optional)
    volumes:
      - ./haproxy-minio.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - rw-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000 || exit 1'"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # =============================================================================
  # RisingWave Meta Nodes (HA)
  # Connected directly to minio-1:9000
  # =============================================================================
  meta-node-0:
    <<: *image
    command:
      - meta-node
      - "--listen-addr"
      - "0.0.0.0:5690"
      - "--advertise-addr"
      - "meta-node-0:5690"
      - "--dashboard-host"
      - "0.0.0.0:5691"
      - "--prometheus-host"
      - "0.0.0.0:1250"
      - "--prometheus-endpoint"
      - "http://prometheus:9500"
      - "--backend"
      - "sql"
      - "--sql-endpoint"
      - "postgres://postgres:@postgres-primary:5432/metadata"
      - "--state-store"
      - "hummock+minio://hummockadmin:hummockadmin@minio-lb:9000/hummock001"
      - "--data-directory"
      - "hummock_001"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "5690"
      - "1250"
      - "5691"
    ports:
      - "5690:5690"
      - "5691:5691"
    depends_on:
      postgres-primary:
        condition: service_healthy
      minio-1:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: meta-node-0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5690; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  meta-node-1:
    <<: *image
    command:
      - meta-node
      - "--listen-addr"
      - "0.0.0.0:5690"
      - "--advertise-addr"
      - "meta-node-1:5690"
      - "--dashboard-host"
      - "0.0.0.0:5691"
      - "--prometheus-host"
      - "0.0.0.0:1250"
      - "--prometheus-endpoint"
      - "http://prometheus:9500"
      - "--backend"
      - "sql"
      - "--sql-endpoint"
      - "postgres://postgres:@postgres-primary:5432/metadata"
      - "--state-store"
      - "hummock+minio://hummockadmin:hummockadmin@minio-lb:9000/hummock001"
      - "--data-directory"
      - "hummock_001"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "5690"
      - "1250"
      - "5691"
    ports:
      - "5692:5690"
      - "5693:5691"
    depends_on:
      postgres-primary:
        condition: service_healthy
      minio-1:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: meta-node-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5690; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  # =============================================================================
  # RisingWave Compute Nodes
  # =============================================================================
  compute-node-0:
    <<: *image
    command:
      - compute-node
      - "--listen-addr"
      - "0.0.0.0:5688"
      - "--advertise-addr"
      - "compute-node-0:5688"
      - "--prometheus-listener-addr"
      - "0.0.0.0:1222"
      - "--meta-address"
      - "http://meta-node-0:5690"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "5688"
      - "1222"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
      RW_OBJECT_STORE_REQUEST_TIMEOUT_MS: "120000"
      RW_OBJECT_STORE_STREAMING_UPLOAD_TIMEOUT_MS: "300000"
    container_name: compute-node-0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5688; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - rw-network

  compute-node-1:
    <<: *image
    command:
      - compute-node
      - "--listen-addr"
      - "0.0.0.0:5688"
      - "--advertise-addr"
      - "compute-node-1:5688"
      - "--prometheus-listener-addr"
      - "0.0.0.0:1222"
      - "--meta-address"
      - "http://meta-node-0:5690"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "5688"
      - "1222"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
      RW_OBJECT_STORE_REQUEST_TIMEOUT_MS: "120000"
      RW_OBJECT_STORE_STREAMING_UPLOAD_TIMEOUT_MS: "300000"
    container_name: compute-node-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/5688; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - rw-network

  # =============================================================================
  # RisingWave Frontend Nodes
  # =============================================================================
  frontend-node-0:
    <<: *image
    command:
      - frontend-node
      - "--listen-addr"
      - "0.0.0.0:4566"
      - "--meta-addr"
      - "http://meta-node-0:5690"
      - "--advertise-addr"
      - "frontend-node-0:4566"
      - "--config-path"
      - "/risingwave.toml"
      - "--prometheus-listener-addr"
      - "0.0.0.0:2222"
    expose:
      - "4566"
      - "2222"
    ports:
      - "4566:4566"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: frontend-node-0
    healthcheck:
      test: ["CMD-SHELL", "bash -c '> /dev/tcp/127.0.0.1/4566; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  frontend-node-1:
    <<: *image
    command:
      - frontend-node
      - "--listen-addr"
      - "0.0.0.0:4566"
      - "--meta-addr"
      - "http://meta-node-0:5690"
      - "--advertise-addr"
      - "frontend-node-1:4566"
      - "--config-path"
      - "/risingwave.toml"
      - "--prometheus-listener-addr"
      - "0.0.0.0:2222"
    expose:
      - "4566"
      - "2222"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: frontend-node-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '> /dev/tcp/127.0.0.1/4566; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  # =============================================================================
  # HAProxy Load Balancer for Frontend Nodes
  # =============================================================================
  haproxy:
    image: docker.arvancloud.ir/library/haproxy:2.9-alpine
    container_name: haproxy
    ports:
      - "4567:4566"
      - "8404:8404"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      frontend-node-0:
        condition: service_healthy
      frontend-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4566"]
      # test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/4566 || exit 1'"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - rw-network

  # =============================================================================
  # RisingWave Compactor Nodes
  # =============================================================================
  compactor-node-0:
    <<: *image
    command:
      - compactor-node
      - "--listen-addr"
      - "0.0.0.0:6660"
      - "--advertise-addr"
      - "compactor-node-0:6660"
      - "--prometheus-listener-addr"
      - "0.0.0.0:1260"
      - "--meta-address"
      - "http://meta-node-0:5690"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "6660"
      - "1260"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: compactor-node-0
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/6660; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  compactor-node-1:
    <<: *image
    command:
      - compactor-node
      - "--listen-addr"
      - "0.0.0.0:6660"
      - "--advertise-addr"
      - "compactor-node-1:6660"
      - "--prometheus-listener-addr"
      - "0.0.0.0:1260"
      - "--meta-address"
      - "http://meta-node-0:5690"
      - "--config-path"
      - "/risingwave.toml"
    expose:
      - "6660"
      - "1260"
    depends_on:
      meta-node-0:
        condition: service_healthy
    volumes:
      - "./risingwave.toml:/risingwave.toml"
    environment:
      <<: *risingwave-environment
    container_name: compactor-node-1
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/6660; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  # =============================================================================
  # Monitoring Stack
  # =============================================================================
  prometheus:
    image: "docker.arvancloud.ir/prom/prometheus:latest"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.listen-address=0.0.0.0:9500"
      - "--storage.tsdb.retention.time=30d"
    expose:
      - "9500"
    ports:
      - "9500:9500"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    container_name: prometheus
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'printf \"GET /-/healthy HTTP/1.0\n\n\" | nc localhost 9500; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network

  grafana:
    image: "docker.arvancloud.ir/grafana/grafana-oss:latest"
    expose:
      - "3001"
    ports:
      - "3001:3001"
    depends_on:
      prometheus:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/grafana-risedev-datasource.yml:/etc/grafana/provisioning/datasources/grafana-risedev-datasource.yml
      - ./grafana/grafana-risedev-dashboard.yml:/etc/grafana/provisioning/dashboards/grafana-risedev-dashboard.yml
      - ./dashboards:/dashboards
    environment: {}
    container_name: grafana
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'printf \"GET / HTTP/1.1\n\n\" > /dev/tcp/127.0.0.1/3001; exit $$?;'"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - rw-network

  # =============================================================================
  # RisingWave Console (Management UI)
  # =============================================================================
  risingwave-console:
    image: docker.arvancloud.ir/risingwavelabs/risingwave-console:v0.5.2
    container_name: risingwave-console
    ports:
      - "8020:8020"
      - "8777:8777"
      - "9020:9020"
    environment:
      RCONSOLE_SERVER_PG_DSN: postgres://postgres:@postgres-primary:5432/metadata
      RCONSOLE_SERVER_PORT: 8020
      RCONSOLE_SERVER_DEBUG_ENABLE: "true"
      RCONSOLE_SERVER_DEBUG_PORT: 8777
      RCONSOLE_ROOT_PASSWORD: '123456'
      RCONSOLE_INIT: /risingwave-console-data/init.yaml
      RCONSOLE_RISECTLDIR: /risingwave-console-data/risectl
      RCONSOLE_METRICSPORT: 9020
    volumes:
      - ./dev:/risingwave-console-data
      - risingwave-console-data:/var/lib/risingwave-console
    depends_on:
      postgres-primary:
        condition: service_healthy
      frontend-node-0:
        condition: service_healthy
      frontend-node-1:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8020/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - rw-network
# =============================================================================
# Apache Superset for Data Visualization
# =============================================================================
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
      args:
        - SUPERSET_VERSION=latest
    container_name: superset
    hostname: superset
    depends_on:
      superset-db-init:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      haproxy:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      # Essential environment variables
      SUPERSET_SECRET_KEY: 'SeP@hT@n#123'
      FLASK_ENV: "production"
      FLASK_APP: "superset.app:create_app()"
      
      # Database connection (overrides config file if needed)
      # SQLALCHEMY_DATABASE_URI: "postgresql://postgres@postgres-primary:5432/superset_meta"
      SQLALCHEMY_DATABASE_URI: "postgresql://superset_user@postgres-primary:5432/superset_meta"
 
      # Performance settings
      GUNICORN_CMD_ARGS: "--workers=4 --worker-class=gthread --threads=4 --timeout=120"
      
    volumes:
      - superset-data:/var/lib/superset
      # Optional: Mount for hot reload of config (development only)
      # - ./superset_config.py:/app/pythonpath/superset_config.py:ro
    
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
    networks:
      - rw-network

  # =============================================================================
  # Superset Database Initialization (UNCHANGED)
  # =============================================================================
  superset-db-init:
    image: docker.arvancloud.ir/postgres:18
    container_name: superset-db-init
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    networks:
      - rw-network
    entrypoint:
      - /bin/bash
      - -c
      - |
        echo "Waiting for PostgreSQL primary to be ready for Superset initialization..."
        until pg_isready -h postgres-primary -U postgres -p 5432; do
          echo "Waiting for postgres-primary..."
          sleep 2
        done
        
        echo "Creating Superset metadata database..."
        # Create superset_meta database if it doesn't exist
        psql -h postgres-primary -U postgres -d postgres -c "CREATE DATABASE superset_meta WITH ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE=template0;" 2>&1 | grep -v "already exists" || true
        
        echo "Creating Superset cache database..."
        # Create superset_cache database if it doesn't exist
        psql -h postgres-primary -U postgres -d postgres -c "CREATE DATABASE superset_cache WITH ENCODING 'UTF8' LC_COLLATE='C' LC_CTYPE='C' TEMPLATE=template0;" 2>&1 | grep -v "already exists" || true
        
        echo "Setting up Superset user and permissions..."
        # Create user if not exists - in postgres database
        psql -h postgres-primary -U postgres -d postgres -c "
        DO \$\$ 
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'superset_user') THEN
            CREATE USER superset_user;
          END IF;
        END \$\$;"
        
        # Grant database permissions
        psql -h postgres-primary -U postgres -d postgres -c "
        GRANT ALL PRIVILEGES ON DATABASE superset_meta TO superset_user;
        GRANT ALL PRIVILEGES ON DATABASE superset_cache TO superset_user;"
        
        # Grant schema permissions in superset_meta
        psql -h postgres-primary -U postgres -d superset_meta -c "
        GRANT ALL ON SCHEMA public TO superset_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO superset_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO superset_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO superset_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TYPES TO superset_user;"
        
        # Grant schema permissions in superset_cache
        psql -h postgres-primary -U postgres -d superset_cache -c "
        GRANT ALL ON SCHEMA public TO superset_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO superset_user;"
        
        echo "Superset database initialization complete!"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres-primary-data:
    external: false
  postgres-replica-data:
    external: false
  minio-data-1:
    external: false
  minio-data-2:
    external: false
  minio-data-3:
    external: false
  prometheus-data:
    external: false
  grafana-data:
    external: false
  risingwave-console-data:
    external: false
  superset-data:
    external: false
