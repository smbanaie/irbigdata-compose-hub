global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client  2m
    timeout server  2m

frontend minio_frontend
    bind *:9000
    default_backend minio_backend

backend minio_backend
    balance roundrobin
    option httpchk             # THIS IS REQUIRED
    option http-server-close
    option forwardfor
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio
    http-check expect rstatus ^2|^4
    server minio1 minio-1:9000 check
    server minio2 minio-2:9000 check
    server minio3 minio-3:9000 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
