version: '3.8'

volumes:
  minio-data-1:
  minio-data-2:
  minio-data-3:

services:
  minio-1:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-1
    hostname: minio-1
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data-1:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - sepahram_net

  minio-2:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-2
    hostname: minio-2
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data-2:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - sepahram_net

  minio-3:
    image: docker.arvancloud.ir/minio/minio:latest
    container_name: minio-3
    hostname: minio-3
    command:
      - server
      - "--address"
      - "0.0.0.0:9000"
      - "--console-address"
      - "0.0.0.0:9001"
      - "http://minio-{1...3}:9000/data"
    expose:
      - "9000"
      - "9001"
    ports:
      - "9004:9000"
      - "9005:9001"
    volumes:
      - minio-data-3:/data
    environment:
      MINIO_ROOT_PASSWORD: hummockadmin
      MINIO_ROOT_USER: hummockadmin
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      - sepahram_net

  minio-init:
    image: docker.arvancloud.ir/minio/mc:latest
    container_name: minio-init
    depends_on:
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
      minio-lb:
        condition: service_healthy
    networks:
      - sepahram_net
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for MinIO cluster to be ready..."
        sleep 10
        echo "Setting up MinIO alias..."
        until mc alias set minio http://minio-lb:9000 hummockadmin hummockadmin; do
          echo 'Waiting for MinIO load balancer...'
          sleep 2
        done
        echo "Creating bucket 'hummock001'..."
        mc mb minio/hummock001 --ignore-existing
        echo "MinIO initialization complete!"
    restart: "no"

  minio-lb:
    image: docker.arvancloud.ir/library/haproxy:2.9-alpine
    container_name: minio-lb
    hostname: minio-lb
    depends_on:
      minio-1:
        condition: service_healthy
      minio-2:
        condition: service_healthy
      minio-3:
        condition: service_healthy
    ports:
      - "9010:9000"
      - "8404:8404"
    volumes:
      - ./haproxy-minio.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://localhost:8404/stats || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    networks:
      - sepahram_net

networks:
  sepahram_net:
    name: ${APP_NAME:-sepahram}_network
